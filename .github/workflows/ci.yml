name: CI

on:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        dotnet-quality: 'ga'

    - name: Build and Test Engine & Rules
      run: |
        dotnet test tests/WindowsOptimizer.Core.Tests/WindowsOptimizer.Core.Tests.csproj -c Release
        dotnet test tests/WindowsOptimizer.Rules.Tests/WindowsOptimizer.Rules.Tests.csproj -c Release
        dotnet test tests/WindowsOptimizer.Measurement.Tests/WindowsOptimizer.Measurement.Tests.csproj -c Release
        dotnet test tests/WindowsOptimizer.Scanners.Tests/WindowsOptimizer.Scanners.Tests.csproj -c Release
        dotnet test tests/WindowsOptimizer.Actions.Tests/WindowsOptimizer.Actions.Tests.csproj -c Release
        dotnet test tests/WindowsOptimizer.Service.Tests/WindowsOptimizer.Service.Tests.csproj -c Release
        dotnet test src/WindowsOptimizer.Tests/WindowsOptimizer.Tests.csproj -c Release

    - name: Build WinUI 3 Desktop App (x64)
      run: dotnet build src/WindowsOptimizer.App/WindowsOptimizer.App.csproj -c Release -p:Platform=x64
